# Credenciales de RabbitMQ para sa-platform, selladas con kubeseal.
# Mismas consideraciones que sealedsecret-db-credentials.yaml.
#
# NOTA: el ciphertext de abajo es real y valido, pero RabbitMQ todavia no
# esta instalado en el cluster de demostracion: Bitnami retiro sus imagenes
# publicas de RabbitMQ de Docker Hub (ningun tag de bitnami/rabbitmq resuelve
# ya, ni siquiera "latest"). Cuando se reinstale el broker, debe configurarse
# con la MISMA contrasena que quedo sellada aqui. Ver P8/docs/SECURITY.md en
# el repositorio de codigo.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-broker-credentials
  namespace: sa-p5
spec:
  encryptedData:
    BROKER_PASSWORD: 
  template:
    metadata:
      name: sa-platform-broker-credentials
      namespace: sa-p5
    type: Opaque
