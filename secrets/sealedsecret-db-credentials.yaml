# Credenciales de PostgreSQL para sa-platform, selladas con kubeseal.
#
# Este archivo SI puede vivir en un repositorio Git publico: "encryptedData"
# es ciphertext asimetrico. Solo el controller de Sealed Secrets corriendo en
# el cluster de destino puede descifrarlo, usando una llave privada que nunca
# sale de ese cluster. La contrasena en claro nunca existio en ningun
# repositorio: se genero aleatoriamente, se aplico a PostgreSQL y se sello en
# el mismo paso.
#
# El ciphertext esta atado al namespace y al nombre exactos de abajo (scope
# "strict", el default de Sealed Secrets). Si cambia cualquiera de los dos,
# hay que regenerarlo:
#
#   kubectl create secret generic sa-platform-db-credentials \
#     --namespace sa-p5 --dry-run=client \
#     --from-literal=DB_PASSWORD='<password>' -o yaml \
#     | kubeseal --format yaml \
#         --controller-name=sealed-secrets-controller \
#         --controller-namespace=kube-system
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-db-credentials
  namespace: sa-p5
spec:
  encryptedData:
    DB_PASSWORD: 
  template:
    metadata:
      name: sa-platform-db-credentials
      namespace: sa-p5
    type: Opaque
